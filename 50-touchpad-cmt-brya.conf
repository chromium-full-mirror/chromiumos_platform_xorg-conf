Section "InputClass"
    Identifier      "touchpad redrix"
    MatchIsTouchpad "on"
    MatchDevicePath "/dev/input/event*"
    MatchUSBID      "04F3:323B|04F3:044A"

    Option          "Compute Surface Area from Pressure" "0"
EndSection
