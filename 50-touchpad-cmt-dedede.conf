# Drawman/Drawlat/Drawcia
Section "InputClass"
    Identifier      "touchpad dedede elan"
    MatchIsTouchpad "on"
    MatchDevicePath "/dev/input/event*"
    MatchProduct    "Elan"
    MatchUSBID      "04f3:0100|04f3:00ee|04f3:0101"
    Option          "Zero Finger Click Enable" "0"
EndSection
